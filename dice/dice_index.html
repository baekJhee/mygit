<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="실감나는 3D 회전 애니메이션과 1개/2개 모드 선택이 가능한 프리미엄 주사위 던지기 웹 애플리케이션입니다.">
  <title>🎲 3D 주사위 던지기_test</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <!-- 앱 헤더 (컴팩트 상단 바) -->
    <header class="app-header">
      <div class="header-main-bar">
        <div class="header-left">
          <div class="title-badge">
            <span>🎲</span>
            <span>3D Physics</span>
          </div>
          <h1>3D 주사위 던지기</h1>
          <span class="header-sub">실감나는 3D 물리 시뮬레이션</span>
        </div>

        <!-- 테마 전환기 (시스템 / 라이트 / 다크) -->
        <div class="theme-switcher" role="group" aria-label="테마 모드 선택">
          <button id="theme-system-btn" class="theme-btn active" type="button" title="시스템 설정 따름">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </button>
          <button id="theme-light-btn" class="theme-btn" type="button" title="라이트 모드">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <button id="theme-dark-btn" class="theme-btn" type="button" title="다크 모드">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- 메인 레이아웃: 주사위 스테이지 + 사이드 결과 패널 -->
    <main class="game-layout">
      <!-- 1. 주사위 게임 영역 -->
      <section class="glass-card stage-card" aria-label="주사위 플레이 영역">
        <!-- 상단 옵션 패널 (주사위 개수 & 질감 선택) -->
        <div class="stage-options-bar">
          <!-- 모드 선택 탭 (1개 ~ 5개) -->
          <div class="mode-selector" role="tablist" aria-label="주사위 개수 선택">
            <button id="mode-1" class="mode-btn" data-count="1" role="tab" aria-selected="false" aria-controls="dice-arena">
              <span>🎲 1</span>
            </button>
            <button id="mode-2" class="mode-btn active" data-count="2" role="tab" aria-selected="true" aria-controls="dice-arena">
              <span>🎲 2</span>
            </button>
            <button id="mode-3" class="mode-btn" data-count="3" role="tab" aria-selected="false" aria-controls="dice-arena">
              <span>🎲 3</span>
            </button>
            <button id="mode-4" class="mode-btn" data-count="4" role="tab" aria-selected="false" aria-controls="dice-arena">
              <span>🎲 4</span>
            </button>
            <button id="mode-5" class="mode-btn" data-count="5" role="tab" aria-selected="false" aria-controls="dice-arena">
              <span>🎲 5</span>
            </button>
          </div>

          <!-- 질감 선택 탭 (나무, 플라스틱, 쇠, 유리) -->
          <div class="material-selector" role="group" aria-label="주사위 질감 선택">
            <button id="mat-wood" class="mat-btn" data-material="wood" type="button" title="나무 질감 및 효과음">
              <span>🪵 나무</span>
            </button>
            <button id="mat-plastic" class="mat-btn active" data-material="plastic" type="button" title="플라스틱 질감 및 효과음">
              <span>🎲 플라스틱</span>
            </button>
            <button id="mat-metal" class="mat-btn" data-material="metal" type="button" title="쇠/금속 질감 및 효과음">
              <span>⚙️ 쇠</span>
            </button>
            <button id="mat-glass" class="mat-btn" data-material="glass" type="button" title="유리 질감 및 효과음">
              <span>💎 유리</span>
            </button>
          </div>
        </div>

        <!-- 주사위 3D 뷰포트 아레나 -->
        <div id="dice-arena" class="dice-arena" tabindex="0" role="region" aria-label="3D 주사위 필드 (클릭하여 던지기)">
          <div id="canvas-container" class="canvas-container"></div>
          <div id="arena-hint" class="arena-hint">
            <span>화면을 터치/클릭하거나 스페이스바를 눌러 던지세요</span>
          </div>
        </div>

        <!-- 컨트롤 버튼 바 -->
        <div class="controls-bar">
          <!-- 1번 굴리기 버튼 -->
          <button id="roll-btn" class="roll-btn" type="button" aria-label="1번 굴리기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
            </svg>
            <span>1번 굴리기</span>
          </button>

          <!-- 연속 굴리기 / 멈추기 버튼 -->
          <button id="continuous-btn" class="continuous-btn" type="button" aria-label="연속으로 굴리기">
            <!-- 기본 상태 아이콘 (회전 루프) -->
            <svg class="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 2l4 4-4 4"/>
              <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
              <path d="M7 22l-4-4 4-4"/>
              <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
            </svg>
            <!-- 멈추기 상태 아이콘 (스퀘어 정지) -->
            <svg class="icon-stop" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
              <rect x="5" y="5" width="14" height="14" rx="2" />
            </svg>
            <span class="btn-text">연속 굴리기</span>
          </button>

          <!-- 사운드 토글 버튼 -->
          <button id="sound-toggle-btn" class="sound-toggle-btn" type="button" title="사운드 켜짐 (클릭시 음소거)"
            aria-label="효과음 토글">
            <!-- Sound On Icon -->
            <svg id="sound-icon-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <!-- Sound Off Icon -->
            <svg id="sound-icon-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
        </div>
      </section>

      <!-- 2. 사이드 결과 패널 -->
      <aside class="glass-card panel-card" aria-label="결과 수치 및 기록">
        <div>
          <div class="panel-header">
            <h2>
              <span>📊</span>
              <span>결과 현황</span>
            </h2>
            <div id="status-indicator" class="status-indicator" title="준비 완료"></div>
          </div>

          <!-- 메인 결과 수치 박스 -->
          <div id="main-result-box" class="main-result-box">
            <div id="result-caption" class="result-caption">주사위 결과</div>
            <div class="result-number-wrap">
              <span id="result-number" class="result-number">-</span>
            </div>

            <!-- 주사위 1~5개 모드용 개별 눈금 및 계산식 분해 표시 -->
            <div id="dice-breakdown-wrapper" class="dice-breakdown-wrapper">
              <div id="dice-equation" class="dice-equation"></div>
              <div id="dice-breakdown" class="dice-breakdown"></div>
            </div>
          </div>
        </div>

        <!-- 최근 히스토리 목록 -->
        <div class="history-section">
          <div class="history-header">
            <span class="history-title">최근 기록</span>
            <button id="clear-history-btn" class="clear-btn" type="button">기록 비우기</button>
          </div>
          <ul id="history-list" class="history-list">
            <li class="history-empty">아직 던진 기록이 없습니다</li>
          </ul>
        </div>
      </aside>
    </main>

    <!-- 푸터 팁 -->
    <footer class="app-footer">
      <p>💡 팁: <kbd>Space</kbd> 키로 1번 굴리기, <kbd>R</kbd> 키로 연속 굴리기/멈추기 (방향키 ←/→ 로 개수 조절)</p>
    </footer>
  </div>

  <!-- 3D 엔진 라이브러리 (Three.js & Cannon.js) -->
  <script src="js/three.min.js"></script>
  <script src="js/cannon.min.js"></script>
  <!-- 메인 스크립트 로드 -->
  <script src="js/main.js"></script>
</body>

</html>
