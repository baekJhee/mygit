<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="모둠별로 스티커를 붙이고 뗄 수 있는 인터랙티브 모둠 활동 스티커 보드">
  <title>⭐ 모둠 스티커판 - 우리 모둠 칭찬 스티커</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 프리텐다드 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
  <div class="app-container">
    <!-- 상단 헤더 영역 -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-badge">
          <span class="logo-icon">⭐</span>
          <span class="logo-sub">CLASSROOM</span>
        </div>
        <h1 class="app-title">모둠 스티커 보드</h1>
      </div>

      <div class="header-right">
        <!-- 스티커 종류 선택기 (이미지 속 4가지 스티커: 별, 스마일, 하트, 체크) -->
        <div class="sticker-selector" title="스티커 종류 선택">
          <span class="selector-label">스티커 모양</span>
          <div class="sticker-options" id="stickerThemeGroup">
            <button type="button" class="theme-sticker-btn active" data-type="star" title="별">
              <svg viewBox="0 0 36 36"><path fill="#FFB300" d="M18 2.5l4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3L18 26.2l-9.3 4.8 1.8-10.3-7.5-7.3 10.4-1.5L18 2.5z" stroke="#FFA000" stroke-width="0.5" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="theme-sticker-btn" data-type="smile" title="스마일">
              <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="#FFCA28"/><circle cx="12.5" cy="14" r="2.2" fill="#4E342E"/><circle cx="23.5" cy="14" r="2.2" fill="#4E342E"/><path d="M11 20c1.8 4.2 12.2 4.2 14 0" fill="none" stroke="#4E342E" stroke-width="2.6" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="theme-sticker-btn" data-type="heart" title="하트">
              <svg viewBox="0 0 36 36"><path fill="#FF5252" d="M18 31.8S4.5 22.5 4.5 13C4.5 8 8.5 4.5 13.2 4.5c3.2 0 6 1.8 7.3 4.5 1.3-2.7 4.1-4.5 7.3-4.5 4.7 0 8.7 3.5 8.7 8.5 0 9.5-13.5 18.8-18.5 18.8z"/></svg>
            </button>
            <button type="button" class="theme-sticker-btn" data-type="check" title="체크">
              <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="#1E88E5"/><path d="M11 18.5l4.8 4.8 9.5-9.5" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <!-- 액션 버튼들 -->
        <div class="header-actions">
          <!-- 사운드 토글 버튼 -->
          <button type="button" id="soundToggleBtn" class="btn-icon" title="효과음 켜기/끄기">
            <span class="icon" id="soundIcon">🔊</span>
            <span class="btn-text">소리</span>
          </button>

          <!-- 전체 스티커 초기화 버튼 -->
          <button type="button" id="resetAllStickersBtn" class="btn-secondary" title="모든 모둠의 스티커를 0개로 비웁니다">
            <span>🔄</span> 스티커 비우기
          </button>

          <!-- 모둠 설정 버튼 -->
          <button type="button" id="openSettingsBtn" class="btn-primary" title="모둠 수와 스티커 개수를 설정합니다">
            <span>⚙️</span> 모둠 설정
          </button>
        </div>
      </div>
    </header>

    <!-- 모둠 카드 중앙 스테이지 래퍼 (상하좌우 여백 및 중앙 정렬) -->
    <main class="groups-stage" id="groupsStage">
      <div class="groups-container" id="groupsContainer" aria-label="모둠별 스티커 판 목록">
        <!-- JavaScript로 동적 생성됨 -->
      </div>
    </main>
  </div>

  <!-- ================= 모달 1: 모둠 설정 팝업 (심플 & 빠른선택 제거) ================= -->
  <div class="modal-backdrop hidden" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="settingsModalTitle">모둠 설정</h2>
        <button type="button" class="modal-close-btn" id="closeSettingsBtn" title="닫기" aria-label="닫기">×</button>
      </div>

      <form id="settingsForm" onsubmit="return false;" novalidate>
        <div class="modal-body">
          <!-- 모둠 수 입력 -->
          <div class="form-group">
            <div class="label-row">
              <label for="groupCountInput">모둠 수</label>
              <span class="range-badge">3 ~ 20</span>
            </div>
            <div class="input-wrapper">
              <input 
                type="number" 
                id="groupCountInput" 
                name="groupCount" 
                min="3" 
                max="20" 
                step="1" 
                value="3" 
                placeholder="3 ~ 20"
                required
              />
              <span class="input-unit">개</span>
            </div>
          </div>

          <!-- 스티커 개수 입력 -->
          <div class="form-group">
            <div class="label-row">
              <label for="stickerCountInput">모둠당 스티커 개수</label>
              <span class="range-badge">5 ~ 20</span>
            </div>
            <div class="input-wrapper">
              <input 
                type="number" 
                id="stickerCountInput" 
                name="stickerCount" 
                min="5" 
                max="20" 
                step="1" 
                value="5" 
                placeholder="5 ~ 20"
                required
              />
              <span class="input-unit">개</span>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelSettingsBtn">취소</button>
          <button type="submit" class="btn-primary" id="confirmSettingsBtn">확인</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= 모달 2: 유효성 오류 경고 팝업 (범위 벗어남 안내) ================= -->
  <div class="modal-backdrop alert-backdrop hidden" id="alertModal" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" aria-describedby="alertMessage">
    <div class="modal-card alert-card">
      <div class="alert-icon-wrap">
        <span class="alert-symbol">⚠️</span>
      </div>
      <h3 class="alert-title" id="alertTitle">입력 값 확인</h3>
      <div class="alert-content" id="alertMessage">
        <!-- 유효성 검사 실패 메시지가 여기에 동적으로 삽입됨 -->
      </div>
      <div class="alert-footer">
        <button type="button" class="btn-alert-confirm" id="alertConfirmBtn">확인</button>
      </div>
    </div>
  </div>

  <!-- ================= 모달 3: 전체 초기화 확인 모달 ================= -->
  <div class="modal-backdrop alert-backdrop hidden" id="confirmResetModal" role="dialog" aria-modal="true">
    <div class="modal-card alert-card">
      <div class="alert-icon-wrap warning">
        <span class="alert-symbol">🔄</span>
      </div>
      <h3 class="alert-title">스티커를 모두 비우시겠습니까?</h3>
      <p class="alert-content">현재 모든 모둠의 스티커가 0개로 비워집니다.</p>
      <div class="modal-footer justify-center">
        <button type="button" class="btn-secondary" id="cancelResetBtn">취소</button>
        <button type="button" class="btn-danger" id="executeResetBtn">모두 비우기</button>
      </div>
    </div>
  </div>

  <!-- 축하 컨페티 효과 캔버스 -->
  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <!-- 스크립트 연결 -->
  <script src="js/app.js"></script>
</body>
</html>
