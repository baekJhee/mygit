<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 전자칠판 드로잉보드 (Smart Board)</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- lib-drawing-board UMD Bundle -->
    <script src="js/lib-drawing-board.umd.js"></script>
</head>

<body>
    <div class="app-layout">
        <!-- 1. Header Toolbar -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">📋</span>
                <h1 class="app-title">스마트 전자칠판</h1>
            </div>

            <!-- Main Toolbar -->
            <div class="toolbar" id="main-toolbar">
                <!-- Group 1: 모드 및 도구 선택 -->
                <div class="toolbar-section mode-section">
                    <span class="section-label">도구 선택</span>
                    <div class="btn-group">
                        <button class="tool-btn active" data-mode="text" data-tool="text"
                            title="텍스트 모드 (글씨를 자유롭게 입력합니다)">
                            <span class="icon">📝</span>
                            <span class="label">텍스트</span>
                        </button>
                        <button class="tool-btn" data-mode="draw" data-tool="pen" title="펜 그리기 모드 (글씨 위에 필기/그림을 그립니다)">
                            <span class="icon">✏️</span>
                            <span class="label">펜</span>
                        </button>
                        <button class="tool-btn" data-mode="draw" data-tool="highlighter" title="형광펜 (반투명 강조)">
                            <span class="icon">🖌️</span>
                            <span class="label">형광펜</span>
                        </button>
                        <button class="tool-btn" data-mode="draw" data-tool="eraser" title="지우개 (그린 선을 지웁니다)">
                            <span class="icon">🧹</span>
                            <span class="label">지우개</span>
                        </button>
                    </div>
                </div>

                <div class="toolbar-divider"></div>

                <!-- Group 2: 색상 선택 (글자 & 선 색상 동시 반영) -->
                <div class="toolbar-section color-section">
                    <span class="section-label">색상</span>
                    <div class="color-palette">
                        <button class="color-chip active" data-color="#000000" style="--chip-color: #000000;"
                            title="검정"></button>
                        <button class="color-chip" data-color="#2563eb" style="--chip-color: #2563eb;"
                            title="파랑"></button>
                        <button class="color-chip" data-color="#dc2626" style="--chip-color: #dc2626;"
                            title="빨강"></button>
                        <button class="color-chip" data-color="#16a34a" style="--chip-color: #16a34a;"
                            title="초록"></button>
                        <button class="color-chip" data-color="#eab308" style="--chip-color: #eab308;"
                            title="노랑"></button>
                        <button class="color-chip" data-color="#9333ea" style="--chip-color: #9333ea;"
                            title="보라"></button>
                        <button class="color-chip" data-color="#ea580c" style="--chip-color: #ea580c;"
                            title="주황"></button>
                        <div class="custom-color-wrapper" title="색상 직접 선택">
                            <input type="color" id="color-picker" value="#000000" aria-label="색상 직접 선택">
                            <span class="picker-preview" id="color-picker-preview"></span>
                        </div>
                    </div>
                </div>

                <div class="toolbar-divider"></div>

                <!-- Group 3: 폰트 사이즈 조절 (textarea 글자 크기) -->
                <div class="toolbar-section highlighted" id="font-size-section">
                    <span class="section-label">폰트 크기</span>
                    <div class="slider-control">
                        <input type="range" id="font-size-slider" min="14" max="72" value="24" class="range-slider">
                        <span id="font-size-val" class="slider-badge">24px</span>
                    </div>
                </div>

                <!-- Group 4: 선 굵기 조절 (드로잉 펜/지우개) -->
                <div class="toolbar-section" id="pen-width-section">
                    <span class="section-label">선 굵기</span>
                    <div class="slider-control">
                        <input type="range" id="line-width-slider" min="1" max="60" value="4" class="range-slider">
                        <span id="line-width-val" class="slider-badge">4px</span>
                    </div>
                </div>

                <div class="toolbar-divider"></div>

                <!-- Group 5: 작업 제어 (Undo, 지우개 토글, 모두 지우기) -->
                <div class="toolbar-section action-section">
                    <span class="section-label">작업 제어</span>
                    <div class="btn-group">
                        <button id="btn-undo" class="action-btn" title="한단계 이전으로 가기 (Ctrl+Z)">
                            <span class="icon">↩️</span>
                            <span class="label">이전으로</span>
                        </button>
                        <button id="btn-eraser-toggle" class="action-btn" title="지우개 모드로 전환">
                            <span class="icon">🧹</span>
                            <span class="label">지우개</span>
                        </button>
                        <button id="btn-clear-all" class="action-btn danger" title="글씨와 드로잉을 모두 지웁니다">
                            <span class="icon">🗑️</span>
                            <span class="label">모두 지우기</span>
                        </button>
                        <button id="btn-download" class="action-btn secondary" title="보드 화면을 이미지로 저장">
                            <span class="icon">💾</span>
                            <span class="label">저장</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 2. Single Unified Board Workspace (한 공간에서 텍스트와 드로잉이 중첩되는 일체형 칠판) -->
        <main class="app-workspace">
            <div class="board-frame" id="board-frame">
                <!-- 보드 헤더 바 -->
                <div class="board-top-bar">
                    <div class="board-mode-indicator">
                        <span class="indicator-dot"></span>
                        <span id="board-mode-text">📝 텍스트 입력 모드</span>
                    </div>
                    <div class="board-tools-mini">
                        <button id="btn-clear-text-only" class="mini-btn" title="입력한 텍스트만 지우기">글씨만 지우기</button>
                        <button id="btn-clear-draw-only" class="mini-btn" title="그린 선만 지우기">선만 지우기</button>
                    </div>
                </div>

                <!-- 일체형 단일 보드 영역 -->
                <div class="single-board-container" id="single-board-container">
                    <!-- Layer 1: 하단 텍스트 레이어 (메모장처럼 바로 작성 가능한 textarea) -->
                    <div class="board-textarea-wrapper" id="board-textarea-wrapper">
                        <textarea id="board-textarea" class="board-textarea"
                            placeholder="글씨를 입력해 주세요. (텍스트 모드에서 바로 타이핑이 가능합니다)&#10;상단의 [폰트 크기]와 [색상]을 조절할 수 있으며,&#10;[✏️ 펜] 모드로 전환하면 작성한 글씨 위에 바로 필기나 그림을 그릴 수 있습니다."
                            spellcheck="false"></textarea>
                    </div>

                    <!-- Layer 2: 상단 드로잉 레이어 (lib-drawing-board) -->
                    <div class="board-drawing-wrapper" id="board-drawing-wrapper">
                        <lib-drawing-board id="drawing-board"></lib-drawing-board>
                    </div>

                    <!-- 지우개 커서 가이드 -->
                    <div id="eraser-cursor" class="eraser-cursor" style="display: none;"></div>
                </div>
            </div>
        </main>

        <!-- 3. Bottom Status Bar -->
        <footer class="app-statusbar">
            <div class="status-left">
                <span id="status-mode">현재: <strong>📝 텍스트 모드 (글씨 입력 가능)</strong></span>
                <span class="status-sep">|</span>
                <span id="status-color">색상: <strong id="status-color-val">#000000</strong></span>
                <span class="status-sep">|</span>
                <span id="status-font-size">폰트: <strong>24px</strong></span>
                <span class="status-sep">|</span>
                <span id="status-pen-size">선 굵기: <strong>4px</strong></span>
            </div>
            <div class="status-right">
                <span id="status-hint">💡 팁: [펜]을 누르면 글씨 위에 필기할 수 있고, [텍스트]를 누르면 다시 글을 쓸 수 있습니다.</span>
            </div>
        </footer>
    </div>

    <!-- Main Module Script -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
