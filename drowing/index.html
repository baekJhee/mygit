<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 전자칠판 드로잉보드 (Smart Board)</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- lib-drawing-board UMD Bundle -->
    <script src="js/lib-drawing-board.umd.js"></script>
</head>

<body>
    <div class="app-layout">
        <!-- 1. Header Toolbar (이미지 레퍼런스 스타일) -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">📋</span>
                <h1 class="app-title">스마트 전자칠판</h1>
            </div>

            <!-- Main Toolbar -->
            <div class="toolbar" id="main-toolbar">
                <!-- ====================================================
                     [Group 1: 텍스트 관련] 가 | 폰트크기▼ | 색상▼
                     ==================================================== -->
                <div class="toolbar-group-card" id="group-text">
                    <!-- 1. '가' 텍스트 모드 버튼 -->
                    <button class="tool-btn active text-mode-btn" id="btn-mode-text" data-mode="text" data-tool="text"
                        title="텍스트 입력 모드">
                        <span class="btn-text-char">가</span>
                    </button>

                    <!-- 2. 폰트크기 드롭다운 (10px ~ 100px, 10단위) -->
                    <div class="custom-dropdown" id="dropdown-font-size">
                        <button class="dropdown-toggle" id="btn-font-size-toggle" title="폰트 크기 선택">
                            <span class="dropdown-label" id="label-font-size">폰트크기</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-menu font-size-menu">
                            <div class="dropdown-item active" data-value="30">30px</div>
                            <div class="dropdown-item" data-value="40">40px</div>
                            <div class="dropdown-item" data-value="50">50px</div>
                            <div class="dropdown-item" data-value="60">60px</div>
                            <div class="dropdown-item" data-value="70">70px</div>
                            <div class="dropdown-item" data-value="80">80px</div>
                            <div class="dropdown-item" data-value="90">90px</div>
                            <div class="dropdown-item" data-value="100">100px</div>
                        </div>
                    </div>

                    <!-- 3. 텍스트 전용 색상 드롭다운 -->
                    <div class="custom-dropdown" id="dropdown-text-color">
                        <button class="dropdown-toggle" id="btn-text-color-toggle" title="텍스트 글자 색상 선택">
                            <span class="color-preview-pill" id="text-color-preview"
                                style="background-color: #000000;"></span>
                            <span class="dropdown-label">색상</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-menu color-menu">
                            <div class="color-grid">
                                <button class="color-item active" data-color="#000000" style="--c: #000000;"
                                    title="검정"></button>
                                <button class="color-item" data-color="#2563eb" style="--c: #2563eb;"
                                    title="파랑"></button>
                                <button class="color-item" data-color="#dc2626" style="--c: #dc2626;"
                                    title="빨강"></button>
                                <button class="color-item" data-color="#16a34a" style="--c: #16a34a;"
                                    title="초록"></button>
                                <button class="color-item" data-color="#eab308" style="--c: #eab308;"
                                    title="노랑"></button>
                                <button class="color-item" data-color="#9333ea" style="--c: #9333ea;"
                                    title="보라"></button>
                                <button class="color-item" data-color="#ea580c" style="--c: #ea580c;"
                                    title="주황"></button>
                                <button class="color-item" data-color="#ffffff"
                                    style="--c: #ffffff; border: 1px solid #ccc;" title="흰색"></button>
                            </div>
                            <div class="custom-color-picker-row">
                                <label for="input-text-color">직접 선택:</label>
                                <input type="color" id="input-text-color" value="#000000">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ====================================================
                     [Group 2: 펜 드로잉 관련] ✏️ | 굵기▼ | 색상▼
                     ==================================================== -->
                <div class="toolbar-group-card" id="group-pen">
                    <!-- 1. '✏️' 펜 드로잉 모드 버튼 -->
                    <button class="tool-btn pen-mode-btn" id="btn-mode-pen" data-mode="draw" data-tool="pen"
                        title="펜 그리기 모드">
                        <span class="icon">✏️</span>
                    </button>

                    <!-- 2. 선 굵기 드롭다운 -->
                    <div class="custom-dropdown" id="dropdown-pen-width">
                        <button class="dropdown-toggle" id="btn-pen-width-toggle" title="선 굵기 선택">
                            <span class="dropdown-label" id="label-pen-width">굵기</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-menu width-menu">
                            <div class="dropdown-item" data-value="2"><span class="width-preview"
                                    style="height: 2px;"></span> 2px </div>
                            <div class="dropdown-item active" data-value="4"><span class="width-preview"
                                    style="height: 4px;"></span> 4px </div>
                            <div class="dropdown-item" data-value="8"><span class="width-preview"
                                    style="height: 8px;"></span> 8px </div>
                            <div class="dropdown-item" data-value="12"><span class="width-preview"
                                    style="height: 12px;"></span> 12px </div>
                            <div class="dropdown-item" data-value="16"><span class="width-preview"
                                    style="height: 16px;"></span> 16px </div>
                            <div class="dropdown-item" data-value="24"><span class="width-preview"
                                    style="height: 20px;"></span> 24px </div>
                            <div class="dropdown-item" data-value="32"><span class="width-preview"
                                    style="height: 24px;"></span> 32px </div>
                        </div>
                    </div>

                    <!-- 3. 펜 전용 색상 드롭다운 -->
                    <div class="custom-dropdown" id="dropdown-pen-color">
                        <button class="dropdown-toggle" id="btn-pen-color-toggle" title="펜 선 색상 선택">
                            <span class="color-preview-pill" id="pen-color-preview"
                                style="background-color: #000000;"></span>
                            <span class="dropdown-label">색상</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-menu color-menu">
                            <div class="color-grid">
                                <button class="color-item active" data-color="#000000" style="--c: #000000;"
                                    title="검정"></button>
                                <button class="color-item" data-color="#2563eb" style="--c: #2563eb;"
                                    title="파랑"></button>
                                <button class="color-item" data-color="#dc2626" style="--c: #dc2626;"
                                    title="빨강"></button>
                                <button class="color-item" data-color="#16a34a" style="--c: #16a34a;"
                                    title="초록"></button>
                                <button class="color-item" data-color="#eab308" style="--c: #eab308;"
                                    title="노랑"></button>
                                <button class="color-item" data-color="#9333ea" style="--c: #9333ea;"
                                    title="보라"></button>
                                <button class="color-item" data-color="#ea580c" style="--c: #ea580c;"
                                    title="주황"></button>
                                <button class="color-item" data-color="#ffffff"
                                    style="--c: #ffffff; border: 1px solid #ccc;" title="흰색"></button>
                            </div>
                            <div class="custom-color-picker-row">
                                <label for="input-pen-color">직접 선택:</label>
                                <input type="color" id="input-pen-color" value="#000000">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ====================================================
                     [Group 3: 제어 관련] ↩️ | 🧹(지우개) | 🧹✏️(선 지우기) | 🗑️(모두 지우기)
                     ==================================================== -->
                <div class="toolbar-group-card" id="group-action">
                    <!-- 1. 한단계 이전 (Undo) -->
                    <button id="btn-undo" class="tool-btn icon-only-btn" title="한단계 이전으로 가기 (Ctrl+Z)">
                        <svg class="svg-icon" viewBox="0 0 24 24" width="20" height="20" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 14L4 9l5-5" />
                            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
                        </svg>
                    </button>

                    <!-- 2. 드래그 지우개 도구 (단 하나만 존재!) -->
                    <button id="btn-eraser" class="tool-btn icon-only-btn" data-mode="draw" data-tool="eraser"
                        title="드래그 지우개 (선 지우기 도구)">
                        <svg class="svg-icon" viewBox="0 0 24 24" width="20" height="20" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M19 20H5a1 1 0 0 1-1-1v-2.5a2 2 0 0 1 .59-1.41L14 5.67a3 3 0 0 1 4.24 0l1.42 1.42a3 3 0 0 1 0 4.24L10.33 20H19" />
                        </svg>
                    </button>

                    <!-- 3. 그린 선만 지우기 (텍스트 유지, 드로잉 선만 일괄 삭제) -->
                    <button id="btn-clear-draw-only" class="tool-btn icon-only-btn" title="그린 선만 모두 지우기">
                        <span class="combo-icon">🧹✏️</span>
                    </button>

                    <!-- 4. 모두 지우기 (텍스트 + 드로잉 모두 초기화) -->
                    <button id="btn-clear-all" class="tool-btn icon-only-btn danger-hover" title="글씨와 드로잉을 모두 지웁니다">
                        <svg class="svg-icon" viewBox="0 0 24 24" width="20" height="20" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            <line x1="10" y1="11" x2="10" y2="17" />
                            <line x1="14" y1="11" x2="14" y2="17" />
                        </svg>
                    </button>

                    <!-- 5. 이미지 저장 -->
                    <button id="btn-download" class="tool-btn icon-only-btn secondary-hover" title="보드 화면을 이미지로 저장">
                        <span class="icon">💾</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 2. Single Unified Board Workspace (한 공간 일체형 전자칠판) -->
        <main class="app-workspace">
            <div class="board-frame" id="board-frame">
                <!-- 보드 헤더 바 -->
                <div class="board-top-bar">
                    <div class="board-mode-indicator">
                        <span class="indicator-dot"></span>
                        <span id="board-mode-text">📝 텍스트 입력 모드</span>
                    </div>
                    <div class="board-tools-mini">
                        <button id="btn-clear-text-only" class="mini-btn" title="입력한 텍스트만 지우기">글씨만 지우기</button>
                    </div>
                </div>

                <!-- 일체형 단일 보드 영역 -->
                <div class="single-board-container mode-text" id="single-board-container">
                    <!-- Layer 1: 하단 텍스트 레이어 (Textarea) -->
                    <div class="board-textarea-wrapper" id="board-textarea-wrapper">
                        <textarea id="board-textarea" class="board-textarea"
                            placeholder="글씨를 입력해 주세요. (텍스트 모드에서 바로 타이핑이 가능합니다)&#10;상단의 [폰트크기▼]와 [색상▼]을 조절할 수 있으며,&#10;[✏️] 펜 모드로 전환하면 작성한 글씨 위에 바로 필기나 그림을 그릴 수 있습니다."
                            spellcheck="false"></textarea>
                    </div>

                    <!-- Layer 2: 상단 드로잉 레이어 (lib-drawing-board) -->
                    <div class="board-drawing-wrapper" id="board-drawing-wrapper">
                        <lib-drawing-board id="drawing-board"></lib-drawing-board>
                    </div>

                    <!-- 지우개 커서 가이드 -->
                    <div id="eraser-cursor" class="eraser-cursor" style="display: none;"></div>
                </div>
            </div>
        </main>

        <!-- 3. Bottom Status Bar -->
        <footer class="app-statusbar">
            <div class="status-left">
                <span id="status-mode">현재: <strong>📝 텍스트 모드</strong></span>
                <span class="status-sep">|</span>
                <span id="status-text-info">텍스트 색상: <strong id="status-text-color-val">#000000</strong>, 크기: <strong
                        id="status-font-size-val">24px</strong></span>
                <span class="status-sep">|</span>
                <span id="status-pen-info">펜 색상: <strong id="status-pen-color-val">#000000</strong>, 굵기: <strong
                        id="status-pen-width-val">4px</strong></span>
            </div>
            <div class="status-right">
                <span id="status-hint">💡 팁: [가]로 글씨를 쓰고, [✏️]로 필기하고, [🧹]로 선을 지웁니다.</span>
            </div>
        </footer>
    </div>

    <!-- Main Module Script -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
