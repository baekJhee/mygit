<body>
    <h1>제 2 장: 파싱 및 네비게이션 구조</h1>
    <p>EPUB 파일은 ZIP 압축 파일 내부의 XML 구조체로 구성되어 있습니다.</p>
    <p><code>META-INF/container.xml</code> 파일은 패키지 파일(OPF)의 상대 위치를 정의하며, <code>content.opf</code> 파일은 전체 리소스 매니페스트와 독서 순서(Spine)를 담고 있습니다.</p>
    <p>좌측 목차 버튼을 클릭하면 목차 목록을 확인하고 원하는 챕터로 즉시 이동할 수 있습니다.</p>
</body>
</html>
