<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>제 1 장: EPUB 뷰어 시작하기</title>
    <link rel="stylesheet" type="text/css" href="css/epub.css"/>
</head>
<body>
    <h1>제 1 장: EPUB 뷰어 시작하기</h1>
    <p>본 뷰어는 웹 서비스 상에서 압축 해제된 EPUB 폴더 경로를 URL 파라미터(<code>?path=...</code>)로 수신하여 실행됩니다.</p>
    <p>별도의 서버 사이드 빌드 과정 없이 순수 HTML, CSS, JavaScript 만으로 <code>container.xml</code> 및 <code>OPF</code> 메타데이터를 직접 해석합니다.</p>
    <h2>주요 특징</h2>
    <ul>
        <li>URL 파라미터를 통한 동적 책 데이터 로딩</li>
        <li>EPUB 표준 XML 구조 자동 해석</li>
        <li>반응형 뷰어 및 하단 이동 바 지원</li>
    </ul>
</body>
</html>
