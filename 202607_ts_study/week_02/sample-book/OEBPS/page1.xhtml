<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>앨범 Page 1 - 일상의 기록</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <article class="album-page">
        <header class="page-header">
            <h2>Part 1: 아름다운 일상의 기록</h2>
            <p class="page-desc">우측 [사진 등록] 버튼을 통해 나만의 앨범 사진을 업로드할 수 있습니다.</p>
        </header>

        <div class="gallery-welcome-box">
            <div class="welcome-icon">📸</div>
            <h4>앨범 사진 등록 가이드</h4>
            <p>1. 상단 툴바 우측의 <strong>[사진 등록]</strong> 버튼을 누르세요.<br />
                2. PC에 보관된 사진 파일을 드래그 앤 드롭하거나 선택해 업로드합니다.<br />
                3. 사진 제목과 소중한 추억 메모를 함께 입력하고 앨범에 보관해 보세요!</p>
        </div>
    </article>
