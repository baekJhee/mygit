<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Web Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Header Toolbar -->
    <header class="viewer-header">
        <div class="header-left">
            <button id="toc-btn" class="btn-icon" title="목차 열기" aria-label="목차 열기">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1 id="book-title" class="book-title">EPUB 뷰어 로딩 중...</h1>
        </div>

        <div class="header-right">
            <div class="theme-selector">
                <button class="theme-btn active" data-theme="light">Light</button>
                <button class="theme-btn" data-theme="sepia">Sepia</button>
                <button class="theme-btn" data-theme="dark">Dark</button>
            </div>
        </div>
    </header>

    <!-- TOC Sidebar Drawer -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>목차 (Table of Contents)</h3>
            <button id="close-toc-btn" class="btn-icon" title="닫기" aria-label="닫기">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <ul id="toc-list" class="toc-list">
            <!-- Dynamic TOC Items -->
        </ul>
    </aside>

    <!-- Main Content Reader Area -->
    <main class="main-wrapper">
        <button id="prev-btn" class="nav-btn nav-prev" title="이전 페이지 (←)" aria-label="이전 페이지">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <section class="iframe-container">
            <iframe id="content-iframe" class="content-iframe" title="EPUB 콘텐츠 본문"></iframe>
        </section>

        <button id="next-btn" class="nav-btn nav-next" title="다음 페이지 (→)" aria-label="다음 페이지">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </main>

    <!-- Bottom Status Bar -->
    <footer class="bottom-bar">
        <span id="page-indicator">0 / 0</span>
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span>EPUB Uncompressed Viewer</span>
    </footer>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="overlay">
        <div class="spinner"></div>
        <p style="font-weight: 500;">EPUB 도서를 분석하는 중입니다...</p>
    </div>

    <!-- Error State Overlay -->
    <div id="error-overlay" class="overlay hidden">
        <div class="error-card">
            <h4>EPUB 도서를 불러올 수 없습니다</h4>
            <p id="error-message">지정된 경로에 유효한 EPUB 디렉터리가 존재하지 않습니다.</p>
            
            <div class="url-input-group">
                <input type="text" id="custom-url-input" class="url-input" placeholder="예: ./sample-book" value="./sample-book">
                <button id="reload-btn" class="btn-primary">불러오기</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
